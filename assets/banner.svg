<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- グラデーション定義 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="boostGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="480" fill="url(#bgGrad)"/>
  <rect width="1200" height="480" fill="url(#sunGlow)"/>

  <!-- 背景グリッド（サイバーパンク/オフィス廊下パースペクティブ） -->
  <g stroke="rgba(0, 240, 255, 0.12)" stroke-width="1.5">
    <line x1="600" y1="180" x2="0" y2="480"/>
    <line x1="600" y1="180" x2="180" y2="480"/>
    <line x1="600" y1="180" x2="360" y2="480"/>
    <line x1="600" y1="180" x2="520" y2="480"/>
    <line x1="600" y1="180" x2="680" y2="480"/>
    <line x1="600" y1="180" x2="840" y2="480"/>
    <line x1="600" y1="180" x2="1020" y2="480"/>
    <line x1="600" y1="180" x2="1200" y2="480"/>

    <line x1="200" y1="280" x2="1000" y2="280"/>
    <line x1="120" y1="330" x2="1080" y2="330"/>
    <line x1="50" y1="390" x2="1150" y2="390"/>
    <line x1="0" y1="460" x2="1200" y2="460"/>
  </g>

  <!-- スピード線＆ドリフトタイヤ痕 -->
  <path d="M 180 470 Q 560 380 720 390 Q 950 400 1120 480" stroke="#ff2a5f" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" filter="url(#neon)"/>
  <path d="M 220 478 Q 580 390 730 400 Q 980 410 1150 490" stroke="#ffcc00" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 140 450 Q 520 370 680 380 Q 910 390 1080 460" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- バッジタグ -->
  <g transform="translate(600, 65)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="rgba(255, 42, 95, 0.18)" stroke="#ff2a5f" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Impact', 'Hiragino Sans', 'Arial Black', sans-serif" font-size="14" font-weight="bold" fill="#ff7b99" text-anchor="middle" letter-spacing="3">
      ⚡ 3D ACTION GAME / THREE.JS PBR &amp; UNREAL BLOOM ⚡
    </text>
  </g>

  <!-- サブタイトル -->
  <text x="600" y="145" font-family="'Impact', 'Hiragino Sans', sans-serif" font-size="34" font-weight="bold" fill="url(#subGrad)" text-anchor="middle" letter-spacing="6" filter="url(#neon)">
    出社拒否！定時退社を掴み取れ
  </text>

  <!-- メインタイトル -->
  <text x="600" y="240" font-family="'Impact', 'Hiragino Kaku Gothic StdN', 'Arial Black', sans-serif" font-size="78" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="8" filter="url(#neon)">
    OFFICE CHAIR DRIFT
  </text>
  <text x="600" y="305" font-family="'Hiragino Kaku Gothic StdN', 'Yu Gothic', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="5">
    オフィスチェア・ドリフト無双
  </text>

  <!-- キャッチコピー -->
  <text x="600" y="360" font-family="'Hiragino Sans', sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
    消火器ジェット搭載のオフィスチェアで夜のビルを爆走！巨大却下ハンコ・稟議書タワー・社長ロボを粉砕せよ！
  </text>

  <!-- 特徴タグチップス -->
  <g transform="translate(600, 415)">
    <!-- チップ1 -->
    <g transform="translate(-320, 0)">
      <rect x="-90" y="-16" width="180" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="#ff2a5f" stroke-width="1"/>
      <text x="0" y="5" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🌪️ 360°回転スピン決裁</text>
    </g>
    <!-- チップ2 -->
    <g transform="translate(-105, 0)">
      <rect x="-90" y="-16" width="180" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="#ffcc00" stroke-width="1"/>
      <text x="0" y="5" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🚀 有給ジェットブースト</text>
    </g>
    <!-- チップ3 -->
    <g transform="translate(110, 0)">
      <rect x="-90" y="-16" width="180" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="#00f0ff" stroke-width="1"/>
      <text x="0" y="5" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🖨️ 暴走複合機ジャンプ台</text>
    </g>
    <!-- チップ4 -->
    <g transform="translate(325, 0)">
      <rect x="-90" y="-16" width="180" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="#00ff88" stroke-width="1"/>
      <text x="0" y="5" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🤖 巨大決裁ロボ社長戦</text>
    </g>
  </g>
</svg>
