<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0051ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- 背景サークル -->
  <circle cx="32" cy="32" r="30" fill="#0d111d" stroke="#ff2a5f" stroke-width="2"/>

  <!-- ジェット噴射の炎 / スピードライン -->
  <path d="M12 44 C8 42, 6 48, 2 46 C6 50, 10 50, 15 48 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <path d="M14 40 C9 39, 7 43, 4 42 C8 45, 12 44, 17 43 Z" fill="#00f0ff" opacity="0.8"/>

  <!-- ドリフトタイヤ痕 -->
  <path d="M10 54 Q24 50 38 54" stroke="#ff2a5f" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M16 57 Q30 53 44 57" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- オフィスチェア背もたれ -->
  <rect x="24" y="12" width="16" height="20" rx="4" fill="url(#chairGrad)" transform="rotate(-12 32 22)"/>

  <!-- オフィスチェア座面 -->
  <rect x="20" y="29" width="24" height="6" rx="3" fill="#ffffff" transform="rotate(-6 32 32)"/>

  <!-- 支柱シリンダー -->
  <rect x="30" y="34" width="4" height="10" fill="#8892b0"/>

  <!-- キャスターベース（脚） -->
  <path d="M22 46 L32 43 L42 46" stroke="#ccd6f6" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- キャスターホイール -->
  <circle cx="21" cy="48" r="2.5" fill="#ffcc00"/>
  <circle cx="43" cy="48" r="2.5" fill="#ffcc00"/>

  <!-- 火花スパーク -->
  <polygon points="46,24 49,27 47,29 52,30 48,33 49,36 44,32 42,35 43,30 39,28 44,27" fill="#ffcc00" filter="url(#glow)"/>
</svg>
